# `app` and `primary_region` are intentionally omitted so this file stays
# portable. Pass `-a <app>` to flyctl, or let `fly launch` fill them in locally.

[build]
  image = "samanhappy/mcphub:1.0.28"

[env]
  MCPHUB_SETTING_PATH = "/app/data/mcp_settings.json"
  NODE_ENV = "production"
  # Fly Machines are microVMs, so MCPHub's container autodetection does not fire
  # and Express would read the Fly proxy as the client. Without this the OAuth
  # issuer is derived as http:// and per-IP rate limits collapse into one bucket.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "mcphub_data"
  destination = "/app/data"
  initial_size = "1gb"
